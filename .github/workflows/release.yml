name: Release

# Creates a new GitHub Release on every push / merge to main.
# Steps:
#   1. Wait for the CI workflow to succeed on the same SHA.
#   2. Bump the patch version in package.json and commit + tag it.
#   3. Create a GitHub Release with GitHub's autogenerated release notes
#      (pulls merged PRs and notable commits since the last release).
#
# Loop safety: pushes made with GITHUB_TOKEN do not re-trigger workflows,
# so the version-bump commit and tag push will not spawn another run.

on:
  push:
    branches: [main]

permissions:
  contents: write # push version-bump commit + tag, create release

concurrency:
  group: release-main
  cancel-in-progress: false # never cancel an in-flight release

jobs:
  release:
    name: Bump version · tag · release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Wait for CI to pass on this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          echo "Waiting for ci.yml to complete on $SHA..."
          for i in $(seq 1 60); do
            data=$(gh run list --repo "$REPO" --commit "$SHA" \
              --workflow ci.yml --json status,conclusion --limit 1 \
              --jq '.[0]')
            if [ -z "$data" ] || [ "$data" = "null" ]; then
              echo "[$i/60] No CI run yet – retrying in 30 s..."
              sleep 30
              continue
            fi
            status=$(echo "$data"     | jq -r '.status')
            conclusion=$(echo "$data" | jq -r '.conclusion // ""')
            echo "[$i/60] CI status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "✓ CI passed"
                exit 0
              fi
              echo "✗ CI did not pass (conclusion=$conclusion) – aborting release"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for CI after 30 min"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so git log / --generate-notes works
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git bot identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version in package.json
        id: version
        run: |
          current=$(jq -r .version package.json)
          IFS='.' read -r major minor patch <<< "$current"
          new_patch=$((patch + 1))
          new_ver="$major.$minor.$new_patch"
          jq --arg v "$new_ver" '.version = $v' package.json > _tmp.json
          mv _tmp.json package.json
          echo "old=$current"  >> "$GITHUB_OUTPUT"
          echo "new=$new_ver"  >> "$GITHUB_OUTPUT"
          echo "tag=v$new_ver" >> "$GITHUB_OUTPUT"
          echo "Bumped $current → $new_ver"

      - name: Commit version bump and push tag
        run: |
          git add package.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main --follow-tags

      - name: Create GitHub Release with autogenerated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest
          echo "✓ Release ${{ steps.version.outputs.tag }} created"
