name: Publish

# Manual-only workflow for major/minor version releases (v1.0.0, v2.0.0, …).
# Publishes to npm via OIDC trusted publishing with provenance attestation.
# Trust is configured on npm side: srinitude/pi-until-done + this filename.
#
# Steps:
#   1. Bump package.json to the supplied version, commit and tag.
#   2. Run the local release-readiness gate (mise run release-ready).
#   3. Publish to npm with OIDC provenance.
#   4. Create a GitHub Release with autogenerated notes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — no leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write  # push version-bump commit + tag, create release
  id-token: write  # OIDC + provenance attestation

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Bump · publish to npm · release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git bot identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set version in package.json
        id: version
        run: |
          ver="${{ github.event.inputs.version }}"
          jq --arg v "$ver" '.version = $v' package.json > _tmp.json
          mv _tmp.json package.json
          echo "version=$ver"   >> "$GITHUB_OUTPUT"
          echo "tag=v$ver"      >> "$GITHUB_OUTPUT"
          echo "Set version to $ver"

      - name: Commit version bump and push tag
        run: |
          git add package.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main --follow-tags

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.5.0
          install: true
          cache: true
          experimental: true

      - name: Trust mise.toml
        run: mise trust

      - name: Install bun deps
        run: mise run install-deps

      - name: Release-readiness gate
        run: mise run release-ready

      # Node 24 ships npm 11.x — required for OIDC trusted publishing (≥ 11.5.1).
      # NO registry-url: it injects a NODE_AUTH_TOKEN placeholder that breaks OIDC.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify npm supports OIDC trusted publishing
        run: |
          ver=$(npm --version)
          echo "npm $ver"
          node -e "const v=process.argv[1].split('.').map(Number); if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('Need npm >=11.5.1, got '+process.argv[1]); process.exit(1);}" "$ver"

      - name: Publish to npm with provenance via OIDC
        run: npm publish --provenance --access public

      - name: Create GitHub Release with autogenerated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest
          echo "✓ Release ${{ steps.version.outputs.tag }} published"
